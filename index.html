<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omoggle - MOG Battle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="jumpscare-overlay" class="hidden">
    <img id="jumpscare-img" alt="" />
  </div>

  <div id="app">
    <header>
      <div class="logo">OMOGGLE</div>
      <div class="tagline">AI MOG BATTLE</div>
      <div class="header-right">
        <span class="online-count">&#x25CF; <span id="online-count">38,412</span> online</span>
      </div>
    </header>

    <main>
      <div class="battle-arena">

        <!-- Stranger side -->
        <div class="fighter-card" id="stranger-card">
          <div class="fighter-label">STRANGER</div>
          <div class="video-wrap">
            <video id="stranger-video" autoplay loop muted playsinline></video>
            <div class="scan-line"></div>
            <div class="connecting-overlay hidden" id="connecting">
              <div class="spinner"></div>
              <p>Finding opponent…</p>
            </div>
          </div>
          <div class="score-block">
            <div class="score-label">PSL SCORE</div>
            <div class="score-value" id="stranger-score">—</div>
          </div>
          <div class="verdict-tag hidden" id="stranger-verdict"></div>
        </div>

        <!-- VS divider -->
        <div class="vs-column">
          <div class="vs-text">VS</div>
          <button id="next-btn" class="btn-next">NEXT ›</button>
          <button id="stop-btn" class="btn-stop">STOP</button>
        </div>

        <!-- You side -->
        <div class="fighter-card" id="you-card">
          <div class="fighter-label">YOU</div>
          <div class="video-wrap">
            <video id="your-video" autoplay muted playsinline></video>
            <div class="scan-line"></div>
            <div class="camera-blocked hidden" id="cam-blocked">
              <p>📷 Camera access denied</p>
              <p class="small">Allow camera to join the battle</p>
            </div>
          </div>
          <div class="score-block">
            <div class="score-label">PSL SCORE</div>
            <div class="score-value" id="your-score">—</div>
          </div>
          <div class="verdict-tag hidden" id="your-verdict"></div>
        </div>

      </div>

      <div class="result-banner hidden" id="result-banner">
        <span id="result-text"></span>
      </div>
    </main>

    <footer>
      <p>Omoggle uses AI facial analysis. Scores are computed via the PSL biometric scale.</p>
    </footer>
  </div>

  <audio id="next-sound" src="next.wav" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
